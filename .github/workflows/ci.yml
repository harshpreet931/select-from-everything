name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: datasets manifest matches datasets/ and the pinned PGlite
        run: pnpm sql-assets --check
      - name: chapters compile, follow the voice rules, every sql block has a golden
        run: pnpm check
      - name: every sql block and playground example gives its golden output on PGlite
        run: pnpm sql-check
      - name: simulators agree with their recorded traces
        run: pnpm test:sim
      - run: pnpm typecheck
      - name: static build + search index
        run: pnpm build
